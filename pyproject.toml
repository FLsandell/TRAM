[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tram-genomics"
version = "1.1.0"
description = "Trait-associated region analysis with random forests and genomic sliding windows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Felix L. Sandell"},
]
keywords = ["genomics", "random-forest", "GWAS", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "hyperopt>=0.2.7,<1",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  # Hyperopt 0.2.7 still imports pkg_resources, removed in setuptools 81.
  "setuptools>=69,<81",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
tram = "tram_genomics.cli:main"

[project.urls]
Repository = "https://github.com/FLsandell/TRAM"
Issues = "https://github.com/FLsandell/TRAM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
